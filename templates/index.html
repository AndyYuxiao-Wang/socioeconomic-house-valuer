<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>House Price Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
            width: 350px;
            height: fit-content;
        }

        .map-panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }

        h2, h3 {
            margin-top: 0;
            color: #333;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #0056b3;
        }

        .map-container {
            position: relative;
        }

        #lsoa-map {
            height: 600px;
            border-radius: 5px;
            z-index: 1;
        }

        #property-map {
            height: 300px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .layer-control {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid #ddd;
        }

        .layer-control label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e2f0d9;
            border-radius: 5px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 10px 0;
            color: #007bff;
        }

        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border: 1px solid #ddd;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            border-radius: 3px;
        }

        .info-panel {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="dashboard">

        <div class="control-panel">
            <h2>🏠 House Price Predictor</h2>

            <label for="lsoa">LSOA Code:</label>
            <input type="text" id="lsoa" placeholder="e.g., E01000001" required>
            <small style="color: #666; display: block; margin-top: -5px;">
                Click on map to auto-fill LSOA code
            </small>

            <label for="type">Property Type:</label>
            <select id="type" required>
                <option value="Detached">Detached</option>
                <option value="Semi-Detached">Semi-Detached</option>
                <option value="Terrace">Terrace</option>
                <option value="Flat">Flat</option>
            </select>

            <label for="floor">Floor Area (sq m):</label>
            <input type="number" id="floor" placeholder="e.g., 100" required min="1">

            <button onclick="predictPrice()">Predict Price</button>

            <div class="loading" id="loading">Loading...</div>
            <div class="result" id="result"></div>

            <div class="info-panel" id="lsoa-info">
                <strong>Selected LSOA Info:</strong><br>
                <span id="selected-lsoa-details">Click on map to select LSOA</span>
            </div>
        </div>


        <div class="map-panel">
            <h3>🗺️ LSOA Map - Click to Select</h3>

            <div class="layer-control">
                <strong>Display Layer:</strong>
                <label>
                    <input type="radio" name="layer" value="income" checked onchange="updateMapLayer()">
                    💰 Income
                </label>
                <label>
                    <input type="radio" name="layer" value="education" onchange="updateMapLayer()">
                    📚 Education Score
                </label>
                <label>
                    <input type="radio" name="layer" value="crime" onchange="updateMapLayer()">
                    🚔 Crime Decile
                </label>
            </div>

            <div id="lsoa-map"></div>

            <div class="legend" id="legend"></div>

            <h3></h3>
            <div id="property-map"></div>
        </div>
    </div>

    <script>
        // Global variables
        let lsoaMap;
        let propertyMap;

        let lsoaLayer;
        let socioData = {};
        let dataStats = {};
        let currentLayer = 'income';
        let selectedLsoa = null;
        let currentMarker = null;

        const colorScales = {
            income: (value, min, max) => {
                const ratio = (value - min) / (max - min);
                // Pre-defined gradient stops for maximum contrast
                const stops = [
                    { pos: 0.0, color: '#8B0000' },  // Deep red (lowest)
                    { pos: 0.25, color: '#f46d43' }, //Orange-red
                    { pos: 0.5, color: '#fdae61' },  // Orange
                    { pos: 0.75, color: '#fee08b' }, // Yellow
                    { pos: 1.0, color: '#013220' }   // Deep green (highest)
                ];

                // Interpolate between stops
                for (let i = 0; i < stops.length - 1; i++) {
                    if (ratio >= stops[i].pos && ratio <= stops[i + 1].pos) {
                        const t = (ratio - stops[i].pos) / (stops[i + 1].pos - stops[i].pos);
                        // Simple hex interpolation (you can make this more sophisticated)
                        return `hsl(${0 + 120 * ratio}, 85%, ${50 + 15 * Math.sin(ratio * Math.PI)}%)`;
                    }
                }
                return '#1a9850';
            },

            education: (value, min, max) => {
                const ratio = (value - min) / (max - min);
                // Dramatic white to deep purple
                const stops = [
                    { pos: 0.0, color: '#ffffff' }, // Pure white
                    { pos: 0.25, color: '#e6ccff' }, // Very light purple
                    { pos: 0.5, color: '#b366ff' },  // Medium purple
                    { pos: 0.75, color: '#7a00e6' }, // Dark purple
                    { pos: 1.0, color: '#2d004d' }   // Almost black purple
                ];

                return `hsl(275, ${40 + 60 * ratio}%, ${100 - 75 * ratio}%)`;
            },

            crime: (value, min, max) => {
                const ratio = (value - min) / (max - min);
                if (ratio < 0.33) {
                    return '#67000d';
                } else if (ratio < 0.66) {
                    return '#fb6a4a';

                } else {
                    return '#fee0d2';
                }
            }
        };
        // Initialize maps
        function initMaps() {
            // LSOA Map
            lsoaMap = L.map('lsoa-map').setView([51.505, -0.09], 9);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(lsoaMap);

            // Property Map
            propertyMap = L.map('property-map').setView([51.505, -0.09], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(propertyMap);

            // Load LSOA data and GeoJSON
            loadLsoaData();
        }

        async function loadLsoaData() {
            try {
                // Load socioeconomic data
                const response = await fetch('/lsoa-data');
                const data = await response.json();
                socioData = data.socio_data;
                dataStats = data.stats;

                // Load GeoJSON (you need to provide this file)
                const geojsonResponse = await fetch('/static/lsoa_boundaries.geojson');
                const geojson = await geojsonResponse.json();

                // Create the choropleth layer
                lsoaLayer = L.geoJSON(geojson, {
                    style: styleLsoa,
                    onEachFeature: onEachLsoa
                }).addTo(lsoaMap);

                updateMapLayer();
                updateLegend();

            } catch (error) {
                console.error('Error loading LSOA data:', error);
                // Fallback: Show a message on the map
                lsoaMap.eachLayer(layer => {
                    if (layer instanceof L.TileLayer) {
                        layer.bindPopup('LSOA boundary data not loaded. Please add lsoa_boundaries.geojson file.').openPopup();
                    }
                });
            }
        }

        function styleLsoa(feature) {
            const lsoaCode = feature.properties.LSOA21CD;
            const data = socioData[lsoaCode];

            let fillColor = '#cccccc';
            let fillOpacity = 0.4;

            if (data && dataStats[currentLayer]) {
                const value = data[currentLayer.charAt(0).toUpperCase() + currentLayer.slice(1)];
                const stats = dataStats[currentLayer];

                if (value > 0) {
                    fillColor = colorScales[currentLayer](value, stats.min, stats.max);
                    fillOpacity = 0.7;
                }
            }

            return {
                fillColor: fillColor,
                weight: 1,
                opacity: 1,
                color: '#666',
                fillOpacity: fillOpacity
            };
        }

        function onEachLsoa(feature, layer) {
            const lsoaCode = feature.properties.LSOA21CD;
            const data = socioData[lsoaCode];

            let popupContent = `<strong>LSOA: ${lsoaCode}</strong><br>`;

            if (data) {
                popupContent += `
                    Income: £${data.Income.toLocaleString()}<br>
                    Education: ${data.Education}<br>
                    Crime Decile: ${data.Crime} (1=highest crime)
                `;
            } else {
                popupContent += 'No socioeconomic data available';
            }

            layer.bindPopup(popupContent);

            layer.on({
                click: () => selectLsoa(lsoaCode, data, layer)
            });
        }

        function selectLsoa(lsoaCode, data, layer) {
            selectedLsoa = lsoaCode;

            // Update input field
            document.getElementById('lsoa').value = lsoaCode;

            // Highlight selected LSOA
            if (lsoaLayer) {
                lsoaLayer.eachLayer(l => {
                    l.setStyle({ weight: 1, color: '#666' });
                });
                layer.setStyle({ weight: 3, color: '#007bff' });
            }

            // Update info panel
            const detailsDiv = document.getElementById('selected-lsoa-details');
            if (data) {
                detailsDiv.innerHTML = `
                    <strong>${lsoaCode}</strong><br>
                    Income: £${data.Income.toLocaleString()}<br>
                    Education: ${data.Education}<br>
                    Crime Decile: ${data.Crime}<br>
                    ${data.lat && data.lon ? ' a' : 'b'}
                `;

                // Update property map to show LSOA location
                if (data.lat && data.lon) {
                    propertyMap.setView([data.lat, data.lon], 14);
                    if (currentMarker) {
                        propertyMap.removeLayer(currentMarker);
                    }
                    currentMarker = L.marker([data.lat, data.lon]).addTo(propertyMap)
                        .bindPopup(`<strong>${lsoaCode}</strong><br>Selected LSOA`)
                        .openPopup();
                }
            } else {
                detailsDiv.innerHTML = `<strong>${lsoaCode}</strong><br>No data available`;
            }
        }

        function updateMapLayer() {
            const radios = document.getElementsByName('layer');
            for (let radio of radios) {
                if (radio.checked) {
                    currentLayer = radio.value;
                    break;
                }
            }

            if (lsoaLayer) {
                lsoaLayer.setStyle(styleLsoa);
            }

            updateLegend();
        }

        function updateLegend() {
            const legendDiv = document.getElementById('legend');
            const stats = dataStats[currentLayer];

            if (!stats) {

                legendDiv.innerHTML = '<strong>Legend</strong><br>Loading data...';
                return;
            }

            const layerNames = {
                income: 'Annual Income (£)',
                education: 'Education Score',
                crime: 'Crime Decile'
            };

            let legendHtml = `<strong>${layerNames[currentLayer]}</strong><br>`;

            // Create gradient steps
            const steps = 5;
            for (let i = 0; i < steps; i++) {
                const value = stats.min + (stats.max - stats.min) * (i / (steps - 1));
                const color = colorScales[currentLayer](value, stats.min, stats.max);

                let displayValue;
                if (currentLayer === 'income') {
                    displayValue = `£${Math.round(value).toLocaleString()}`;
                } else if (currentLayer === 'crime') {
                    displayValue = `${Math.round(value)} (${value <= 3 ? 'High' : value <= 7 ? 'Med' : 'Low'})`;
                } else {
                    displayValue = value.toFixed(1);
                }

                legendHtml += `
                    <div class="legend-item">
                        <div class="legend-color" style="background: ${color};"></div>
                        <span>${displayValue}</span>
                    </div>
                `;
            }

            legendDiv.innerHTML = legendHtml;
        }

        async function predictPrice() {
            const lsoa = document.getElementById('lsoa').value.trim();
            const type = document.getElementById('type').value;
            const floor = parseFloat(document.getElementById('floor').value);

            if (!lsoa || !type || isNaN(floor)) {
                alert("Please fill in all fields correctly.");
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        LSOA21CD: lsoa,
                        Type: type,
                        "Floor Area": floor
                    })
                });

                const data = await response.json();

                // Hide loading
                document.getElementById('loading').style.display = 'none';

                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <strong>Predicted Price:</strong> £${data.predicted_price.toLocaleString()}<br>
                    <strong>Recommended Range:</strong> £${data.recommended_range[0].toLocaleString()} - £${data.recommended_range[1].toLocaleString()}<br>
                    <strong>Socioeconomic Info:</strong><br>
                    Income: £${data.socio.Income.toLocaleString()}<br>
                    Education: ${data.socio.Education}<br>
                    Crime Decile: ${data.socio.Crime}
                `;

                // Update property map
                if (data.socio.lat && data.socio.lon) {
                    propertyMap.setView([data.socio.lat, data.socio.lon], 14);

                    if (currentMarker) {
                        propertyMap.removeLayer(currentMarker);
                    }

                    currentMarker = L.marker([data.socio.lat, data.socio.lon]).addTo(propertyMap)
                        .bindPopup(resultDiv.innerHTML)
                        .openPopup();
                }

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                console.error('Error:', error);
                alert('Error predicting price. Please try again.');
            }
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', initMaps);
    </script>
</body>
</html>
